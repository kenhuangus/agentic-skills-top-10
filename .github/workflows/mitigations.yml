name: Reference Mitigations

on:
  pull_request:
    paths:
      - 'mitigations/**'
      - 'examples/ast09-execution-receipts/**'
      - '.github/workflows/mitigations.yml'
  push:
    branches: [main]
    paths:
      - 'mitigations/**'
      - 'examples/ast09-execution-receipts/**'
      - '.github/workflows/mitigations.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r mitigations/requirements.txt

      - name: Run test-suite
        working-directory: mitigations
        run: python -m unittest discover -s tests -v

      - name: Smoke-test CLI against fixtures
        working-directory: mitigations
        run: |
          python -m ast_mitigations scan fixtures/benign-skill
          if python -m ast_mitigations scan fixtures/malicious-skill > /dev/null; then
            echo "malicious fixture was not blocked"; exit 1
          fi
